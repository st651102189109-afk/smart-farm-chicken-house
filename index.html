<!DOCTYPE html>
<html lang="th">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Smart Farm Control</title>
  <link rel="stylesheet" href="style.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="container">
  <h1>🐔 ระบบควบคุมโรงเรือน</h1>

  <!-- SENSOR -->
  <div class="card">
    <h2>📊 สถานะเซ็นเซอร์</h2>
    <div class="row">
      <div>🌡️ อุณหภูมิ: <span id="temp">--</span> °C</div>
      <div>💧 ความชื้น: <span id="hum">--</span> %</div>
    </div>
  </div>

  <!-- MODE -->
  <div class="card">
    <h2>⚙️ โหมดการทำงาน</h2>
    <div class="row">
      <button onclick="setMode('auto')" class="auto">AUTO</button>
      <button onclick="setMode('manual')" class="manual">MANUAL</button>
    </div>
    <p>โหมดปัจจุบัน: <span id="mode">--</span></p>
  </div>

  <!-- CONTROL -->
  <div class="card">
    <h2>🎮 ควบคุมอุปกรณ์</h2>
    <div class="row">
      <button onclick="toggleFan(1)">พัดลม ON</button>
      <button onclick="toggleFan(0)">พัดลม OFF</button>
    </div>
    <div class="row">
      <button onclick="toggleLight(1)">ไฟ ON</button>
      <button onclick="toggleLight(0)">ไฟ OFF</button>
    </div>
  </div>
</div>

<script src="firebase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
