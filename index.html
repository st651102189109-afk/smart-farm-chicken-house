<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบควบคุมโรงเรือนไก่อัจฉริยะ (Smart Chicken Farm)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; }
        h1 { text-align: center; color: #2c3e50; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; text-align: center; }
        .data-box { background: #e8f4f8; padding: 15px; border-radius: 8px; }
        .data-box h3 { margin: 0 0 10px 0; font-size: 16px; color: #555; }
        .data-box p { margin: 0; font-size: 24px; font-weight: bold; color: #2980b9; }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        .btn-primary { background: #3498db; color: white; }
        .btn-primary:hover { background: #2980b9; }
        .btn-success { background: #2ecc71; color: white; }
        .btn-success:hover { background: #27ae60; }
        .btn-warning { background: #f1c40f; color: #333; }
        .btn-warning:hover { background: #f39c12; }
        .control-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        input[type="time"], input[type="number"] { padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🐔 Smart Chicken Farm</h1>

    <div class="card">
        <h2>📊 ข้อมูลเซนเซอร์</h2>
        <div class="grid">
            <div class="data-box">
                <h3>อุณหภูมิ</h3>
                <p><span id="temp">--</span> °C</p>
            </div>
            <div class="data-box">
                <h3>ความชื้น</h3>
                <p><span id="hum">--</span> %</p>
            </div>
            <div class="data-box">
                <h3>ระดับน้ำ</h3>
                <p><span id="water">--</span> %</p>
            </div>
            <div class="data-box">
                <h3>ระดับอาหาร</h3>
                <p><span id="food">--</span> %</p>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>🕹️ ระบบควบคุม</h2>
        
        <div class="control-group">
            <span><strong>โหมดการทำงาน:</strong> <span id="modeStatus">--</span></span>
            <button class="btn btn-primary" id="btnMode">เปลี่ยนเป็น MANUAL</button>
        </div>

        <div class="control-group">
            <span><strong>สถานะไฟส่องสว่าง:</strong> <span id="lightStatus">--</span></span>
            <button class="btn btn-warning" id="btnLight">เปิดไฟ (ON)</button>
        </div>

        <div class="control-group" style="border: none;">
            <span><strong>การให้อาหาร:</strong></span>
            <button class="btn btn-success" id="btnFeedNow">🌾 ให้อาหารเดี๋ยวนี้ (Manual Feed)</button>
        </div>
    </div>

    <div class="card">
        <h2>⚙️ ตั้งค่าระบบอัตโนมัติ</h2>
        <div class="control-group">
            <span>เวลาให้อาหารรอบที่ 1:</span>
            <input type="time" id="feedTime1">
        </div>
        <div class="control-group">
            <span>เวลาให้อาหารรอบที่ 2:</span>
            <input type="time" id="feedTime2">
        </div>
        <div class="control-group" style="border: none;">
            <span>ระยะเวลาปล่อยอาหาร (วินาที):</span>
            <input type="number" id="feedDuration" min="1" max="60">
        </div>
        <button class="btn btn-primary" id="btnSaveSettings" style="width: 100%; margin-top: 10px;">💾 บันทึกการตั้งค่า</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // กำหนดค่า Firebase อ้างอิงจากโค้ด C++
    const firebaseConfig = {
        databaseURL: "https://smartfarmchicken-798f2-default-rtdb.asia-southeast1.firebasedatabase.app"
        // หมายเหตุ: หากใช้งานบนเว็บและติดปัญหา Permission Denied คุณอาจต้องเพิ่ม apiKey ที่นี่
        // หรือตั้งค่า Rules ใน Firebase Realtime Database ให้สามารถอ่าน/เขียนได้
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // References to DOM elements
    const ui = {
        temp: document.getElementById('temp'),
        hum: document.getElementById('hum'),
        water: document.getElementById('water'),
        food: document.getElementById('food'),
        modeStatus: document.getElementById('modeStatus'),
        lightStatus: document.getElementById('lightStatus'),
        btnMode: document.getElementById('btnMode'),
        btnLight: document.getElementById('btnLight'),
        btnFeedNow: document.getElementById('btnFeedNow'),
        feedTime1: document.getElementById('feedTime1'),
        feedTime2: document.getElementById('feedTime2'),
        feedDuration: document.getElementById('feedDuration'),
        btnSaveSettings: document.getElementById('btnSaveSettings')
    };

    let currentMode = "AUTO";
    let currentLight = "OFF";

    // 1. อ่านค่าเรียลไทม์จาก Firebase (Path: /coop/)
    const coopRef = ref(db, 'coop');
    onValue(coopRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            // อัปเดตเซนเซอร์
            ui.temp.innerText = data.temperature !== undefined ? data.temperature.toFixed(1) : '--';
            ui.hum.innerText = data.humidity !== undefined ? data.humidity.toFixed(1) : '--';
            ui.water.innerText = data.waterLevel !== undefined ? data.waterLevel : '--';
            ui.food.innerText = data.foodLevel !== undefined ? data.foodLevel : '--';

            // อัปเดตสถานะโหมดและไฟ
            currentMode = data.mode || "AUTO";
            currentLight = data.light || "OFF";
            
            ui.modeStatus.innerText = currentMode;
            ui.modeStatus.style.color = currentMode === "AUTO" ? "green" : "red";
            ui.btnMode.innerText = currentMode === "AUTO" ? "เปลี่ยนเป็น MANUAL" : "เปลี่ยนเป็น AUTO";

            ui.lightStatus.innerText = currentLight;
            ui.btnLight.innerText = currentLight === "ON" ? "ปิดไฟ (OFF)" : "เปิดไฟ (ON)";

            // อัปเดตการตั้งค่าใน Input (เฉพาะตอนโหลด หรือเมื่อมีการเปลี่ยนจากที่อื่น)
            if(document.activeElement !== ui.feedTime1) ui.feedTime1.value = data.feedTime1 || "";
            if(document.activeElement !== ui.feedTime2) ui.feedTime2.value = data.feedTime2 || "";
            if(document.activeElement !== ui.feedDuration) ui.feedDuration.value = data.feedDuration || "";
        }
    });

    // 2. ฟังก์ชันส่งคำสั่งไปยัง Firebase
    ui.btnMode.addEventListener('click', () => {
        const newMode = currentMode === "AUTO" ? "MANUAL" : "AUTO";
        set(ref(db, 'coop/mode'), newMode);
    });

    ui.btnLight.addEventListener('click', () => {
        const newLight = currentLight === "ON" ? "OFF" : "ON";
        set(ref(db, 'coop/light'), newLight);
    });

    ui.btnFeedNow.addEventListener('click', () => {
        set(ref(db, 'coop/feedNow'), true);
        alert("สั่งให้อาหารแล้ว!");
    });

    ui.btnSaveSettings.addEventListener('click', () => {
        set(ref(db, 'coop/feedTime1'), ui.feedTime1.value);
        set(ref(db, 'coop/feedTime2'), ui.feedTime2.value);
        set(ref(db, 'coop/feedDuration'), parseInt(ui.feedDuration.value));
        alert("บันทึกการตั้งค่าเรียบร้อยแล้ว!");
    });

</script>
</body>
</html>
