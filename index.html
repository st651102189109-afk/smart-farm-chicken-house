<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Farm Control</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  <h1>🐔 Smart Farm Controller</h1>

  <!-- SENSOR -->
  <div class="card">
    <h2>📊 Sensor Data</h2>
    <p>🌡️ Temp: <span id="temp">--</span> °C</p>
    <p>💧 Humidity: <span id="hum">--</span> %</p>
    <p>💦 Water: <span id="water">--</span> cm</p>
    <p>🌾 Feed: <span id="feed">--</span> cm</p>
  </div>

  <!-- LIGHT -->
  <div class="card">
    <h2>💡 Light Control</h2>
    <button class="on" onclick="setLight(1)">เปิดไฟ</button>
    <button class="off" onclick="setLight(0)">ปิดไฟ</button>
  </div>

</div>

<script src="firebase-config.js"></script>
<script src="script.js"></script>

</body>
</html>
